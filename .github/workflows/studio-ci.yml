name: ZNIKU Studio CI

# 正式 Studio 门：验证当前 Project Service wire contract、Designer、类型、测试与生产构建。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv for Project Service schema gate
        uses: astral-sh/setup-uv@v7.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python authority dependencies
        working-directory: .
        run: uv sync --locked --extra dev

      - name: Verify Project Service schema
        working-directory: .
        run: uv run --locked --extra dev python tools/generate_project_service_schema.py --check

      - name: Install locked dependencies
        run: npm ci

      - name: Geometry preflight experiment tests
        run: node --test preflight/geometry.test.mjs

      - name: Geometry preflight bounded experiment
        run: node preflight/run.mjs

      - name: Independent production SVG geometry auditor
        run: node --test e2e/batch-b-audit.checks.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Install production browser and synthetic media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Production desktop host, accessibility and bounded performance
        id: production-e2e
        run: npm run test:e2e

      - name: Production measured ports, routing and layout invariants
        id: batch-b-e2e
        run: npx playwright test -c e2e/batch-b.config.ts

      - name: Production external handoff, recovery and late response regressions
        id: batch-c-e2e
        run: npx playwright test -c e2e/batch-c.config.ts

      - name: Upload bounded synthetic failure evidence
        if: failure() && (steps.production-e2e.outcome == 'failure' || steps.batch-b-e2e.outcome == 'failure' || steps.batch-c-e2e.outcome == 'failure')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: studio-synthetic-failure
          path: |
            apps/studio/test-results/**/failure-diagnostics.json
            apps/studio/test-results/**/failure-masked.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit dependencies
        run: npm audit --audit-level=low
