name: ZNIKU Studio CI

# Phase 0 过渡门：本工作流只验证 0.1.0 legacy Studio 与 Python bridge 未被权威切换破坏，
# 0.2.0 正式 Studio 门将在 Phase 3 建立。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv for legacy Python bridge integration
        uses: astral-sh/setup-uv@v7.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install legacy Python authority dependencies
        working-directory: .
        run: uv sync --locked --extra dev

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=low
