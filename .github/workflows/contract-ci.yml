name: ZNIKU Core CI

# Phase 4 Graph Core、SQLite Project Store、Runtime、Project Service 与媒体节点的正式 Python 门禁；尚未清理的 0.1.0
# legacy implementation 继续作为过渡期回归，直到 Phase 5 删除。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-core-runtime-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install and verify Phase 4 media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Test Graph Core, Runtime, Project Service and media nodes
        run: |
          uv run --locked --extra dev pytest \
            tests/test_graph_models.py \
            tests/test_graph_validation.py \
            tests/test_project_store.py \
            tests/test_runtime_repository.py \
            tests/test_runtime_scheduler.py \
            tests/test_runtime_reuse.py \
            tests/test_node_runner.py \
            tests/test_runtime_service.py \
            tests/test_project_service.py \
            tests/test_project_service_host.py \
            tests/test_media_nodes.py \
            tests/test_architecture_authority.py \
            tests/test_version_consistency.py

      - name: Verify Project Service Studio schema
        run: uv run --locked --extra dev python tools/generate_project_service_schema.py --check

      - name: Typecheck Graph Core, Runtime, Project Service and media nodes
        run: |
          uv run --locked --extra dev mypy --no-incremental \
            src/zniku/graph src/zniku/project src/zniku/runtime src/zniku/project_service src/zniku/media \
            tests/test_graph_models.py \
            tests/test_graph_validation.py \
            tests/test_project_store.py \
            tests/test_runtime_repository.py \
            tests/test_runtime_scheduler.py \
            tests/test_runtime_reuse.py \
            tests/test_node_runner.py \
            tests/test_runtime_service.py \
            tests/test_project_service.py \
            tests/test_project_service_host.py \
            tests/test_media_nodes.py \
            tools/generate_project_service_schema.py \
            tools/run_studio_project_service.py \
            tools/create_media_smoke_project.py \
            tools/create_studio_demo_project.py \
            tools/studio_demo_adapter.py

      - name: Lint Graph Core, Runtime, Project Service and media nodes
        run: |
          uv run --locked --extra dev ruff check \
            src/zniku/graph src/zniku/project src/zniku/runtime src/zniku/project_service src/zniku/media \
            tests/test_graph_models.py \
            tests/test_graph_validation.py \
            tests/test_project_store.py \
            tests/test_runtime_repository.py \
            tests/test_runtime_scheduler.py \
            tests/test_runtime_reuse.py \
            tests/test_node_runner.py \
            tests/test_runtime_service.py \
            tests/test_project_service.py \
            tests/test_project_service_host.py \
            tests/test_media_nodes.py \
            tools/generate_project_service_schema.py \
            tools/run_studio_project_service.py \
            tools/create_media_smoke_project.py \
            tools/create_studio_demo_project.py \
            tools/studio_demo_adapter.py

      - name: Format check Graph Core, Runtime, Project Service and media nodes
        run: |
          uv run --locked --extra dev ruff format --check \
            src/zniku/graph src/zniku/project src/zniku/runtime src/zniku/project_service src/zniku/media \
            tests/test_graph_models.py \
            tests/test_graph_validation.py \
            tests/test_project_store.py \
            tests/test_runtime_repository.py \
            tests/test_runtime_scheduler.py \
            tests/test_runtime_reuse.py \
            tests/test_node_runner.py \
            tests/test_runtime_service.py \
            tests/test_project_service.py \
            tests/test_project_service_host.py \
            tests/test_media_nodes.py \
            tools/generate_project_service_schema.py \
            tools/run_studio_project_service.py \
            tools/create_media_smoke_project.py \
            tools/create_studio_demo_project.py \
            tools/studio_demo_adapter.py

  verify-legacy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install legacy Phase 6 media gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Verify legacy generated Studio projection
        run: uv run --locked --extra dev python tools/generate_authoring_projection.py --check

      - name: Verify Phase 3 Project Service schema
        run: uv run --locked --extra dev python tools/generate_project_service_schema.py --check

      - name: Test complete transitional repository
        run: uv run --locked --extra dev pytest

      - name: Verify legacy Phase 6 real-media and long-film gates
        run: uv run --locked --extra dev python tools/run_phase6_validation.py

      - name: Typecheck
        run: uv run --locked --extra dev mypy --no-incremental src tests tools

      - name: Lint
        run: uv run --locked --extra dev ruff check src tests tools

      - name: Format check
        run: uv run --locked --extra dev ruff format --check src tests tools
