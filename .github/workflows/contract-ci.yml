name: ZNIKU Contract CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Verify generated Studio projection
        run: uv run --locked --extra dev python tools/generate_authoring_projection.py --check

      - name: Test
        run: uv run --locked --extra dev pytest

      - name: Typecheck
        run: uv run --locked --extra dev mypy --no-incremental src tests tools

      - name: Lint
        run: uv run --locked --extra dev ruff check src tests tools

      - name: Format check
        run: uv run --locked --extra dev ruff format --check src tests tools
