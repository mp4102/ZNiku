name: ZNIKU Contract CI

# Phase 0 过渡门：本工作流只验证尚未重写的 0.1.0 legacy implementation，
# 不构成 0.2.0 Graph Core 的架构权威或完成证明。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install legacy Phase 6 media gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Verify legacy generated Studio projection
        run: uv run --locked --extra dev python tools/generate_authoring_projection.py --check

      - name: Test
        run: uv run --locked --extra dev pytest

      - name: Verify legacy Phase 6 real-media and long-film gates
        run: uv run --locked --extra dev python tools/run_phase6_validation.py

      - name: Typecheck
        run: uv run --locked --extra dev mypy --no-incremental src tests tools

      - name: Lint
        run: uv run --locked --extra dev ruff check src tests tools

      - name: Format check
        run: uv run --locked --extra dev ruff format --check src tests tools
