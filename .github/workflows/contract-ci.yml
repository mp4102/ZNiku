name: ZNIKU Core CI

# Phase 5 只验证 0.2.0 Graph Core、Project、Runtime、Project Service 与媒体节点。
# 短媒体 smoke 在临时目录生成 12 帧合成视频，不读取用户媒体或旧 Real Acceptance 数据。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install and verify media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Test current 0.2.0 implementation
        run: uv run --locked --extra dev pytest

      - name: Run short synthetic media smoke
        run: uv run --locked --extra dev python tools/run_media_smoke.py

      - name: Verify Project Service Studio schema
        run: uv run --locked --extra dev python tools/generate_project_service_schema.py --check

      - name: Typecheck
        run: uv run --locked --extra dev mypy --no-incremental src tests tools

      - name: Lint
        run: uv run --locked --extra dev ruff check src tests tools

      - name: Format check
        run: uv run --locked --extra dev ruff format --check src tests tools
