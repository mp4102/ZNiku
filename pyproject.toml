[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "zniku"
version = "0.2.0"
description = "ZNIKU 的自由媒体图核心、SQLite Project Store、本地 Runtime 与 Studio Project Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.26,<5",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
desktop = [
  "pyinstaller>=6.22,<7; sys_platform == 'win32'",
]
dev = [
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.26,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zniku = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
allowed-confusables = ["，", "；", "："]

[tool.ruff.format]
quote-style = "double"
